[loraharvesterbox]
extends = stm32_base
board = rak3172
board_upload.maximum_size = 229376 ; 32kb for FS
build_flags = ${stm32_base.build_flags}
  -D LORA_HARVESTER_BOX
  -D STM32WLX_COMMON_TARGET ; build the shared target from helpers/stm32
  -D STM32WLX_BOARD_NAME='"Lora Harvester Box"'
  -D VBAT_DIVIDER=2 ; ADC_BAT sits on a 500k:500k divider, buffered by 100nF at the tap
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D SPI_INTERFACES_COUNT=0
  -D RX_BOOSTED_GAIN=true
  -D STM32WL_ENABLE_SMPS ; run the radio from the SMPS/DC-DC regulator (needs the VLXSMPS coil)
  -D STM32WL_SLEEP_STOP0 ; sleep in Stop0 so the SMPS stays active during continuous RX
;  -D STM32WL_TCXO_VOLTAGE=1.8 ; override the auto-detected default from STM32WLxTarget.cpp
;  -D LORA_TX_POWER=14 ; Defaults to 22 for HP, 14 is for LP version
  -I variants/loraharvesterbox
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/loraharvesterbox>

[env:LoraHarvesterBox_repeater]
extends = loraharvesterbox
build_flags = ${loraharvesterbox.build_flags}
  -D ADVERT_NAME='"Lora Harvester Box Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${loraharvesterbox.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:LoraHarvesterBox_sensor]
extends = loraharvesterbox
build_flags = ${loraharvesterbox.build_flags}
  -D ADVERT_NAME='"Lora Harvester Box Sensor"'
  -D ADMIN_PASSWORD='"password"'
build_src_filter = ${loraharvesterbox.build_src_filter}
  +<../examples/simple_sensor>

[env:LoraHarvesterBox_companion_radio_usb]
extends = loraharvesterbox
build_flags = ${loraharvesterbox.build_flags}
;  -D FORMAT_FS=true
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
build_src_filter = ${loraharvesterbox.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${loraharvesterbox.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LoraHarvesterBox_kiss_modem]
extends = loraharvesterbox
build_src_filter = ${loraharvesterbox.build_src_filter}
  +<../examples/kiss_modem/
