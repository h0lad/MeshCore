[picoloraharvester]
extends = stm32_base
board = rak3172
board_upload.maximum_size = 229376 ; 32kb for FS
build_flags = ${stm32_base.build_flags}
  -D PICO_LORA_HARVESTER
  ; Long sampling time required by the high-impedance battery divider (R13/R14 + C15)
  -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_160CYCLES_5
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D SPI_INTERFACES_COUNT=0
  -D RX_BOOSTED_GAIN=true
  -D STM32WL_ENABLE_SMPS ; run the radio from the SMPS/DC-DC regulator (needs the VLXSMPS coil)
  -D STM32WL_SLEEP_STOP0 ; sleep in Stop0 so the SMPS stays active during continuous RX
;  -D STM32WL_TCXO_VOLTAGE=1.8 ; override the auto-detected default from target.cpp
;  -D LORA_TX_POWER=14 ; Defaults to 22 for HP, 14 is for LP version
  -I variants/picoloraharvester
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/picoloraharvester>

[env:PicoLoRaHarvester_repeater]
extends = picoloraharvester
build_flags = ${picoloraharvester.build_flags}
  -D ADVERT_NAME='"Pico LoRa Harvester Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${picoloraharvester.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:PicoLoRaHarvester_sensor]
extends = picoloraharvester
build_flags = ${picoloraharvester.build_flags}
  -D ADVERT_NAME='"Pico LoRa Harvester Sensor"'
  -D ADMIN_PASSWORD='"password"'
build_src_filter = ${picoloraharvester.build_src_filter}
  +<../examples/simple_sensor>

[env:PicoLoRaHarvester_companion_radio_usb]
extends = picoloraharvester
build_flags = ${picoloraharvester.build_flags}
;  -D FORMAT_FS=true
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
build_src_filter = ${picoloraharvester.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${picoloraharvester.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:PicoLoRaHarvester_kiss_modem]
extends = picoloraharvester
build_src_filter = ${picoloraharvester.build_src_filter}
  +<../examples/kiss_modem/*.cpp>
