[solarmeshtasticnode]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/solarmeshtasticnode
  -D HELTEC_HT_CT62=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D ESP32_CPU_FREQ=80
  -D LORA_TX_POWER=22
  -D PIN_BOARD_SDA=19
  -D PIN_BOARD_SCL=18
  ;-D PIN_USER_BTN=9
  -D PIN_VBAT_READ=1
  -D VBAT_DIVIDER=2.037   ; V_battery / V_pin, calibrated: 4.064V batt -> 1.995V at pin
  -D P_LORA_DIO_1=3
  -D P_LORA_NSS=8
  -D P_LORA_RESET=5
  -D P_LORA_DIO_0=RADIOLIB_NC
  -D P_LORA_DIO_2=RADIOLIB_NC
  -D P_LORA_BUSY=4
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=6
  -D P_LORA_MOSI=7
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/solarmeshtasticnode>

[env:solarmeshtasticnode_repeater]
extends = solarmeshtasticnode
build_flags =
  ${solarmeshtasticnode.build_flags}
  ;-D ARDUINO_USB_MODE=1
  ;-D ARDUINO_USB_CDC_ON_BOOT=1
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${solarmeshtasticnode.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${solarmeshtasticnode.lib_deps}
  ${esp32_ota.lib_deps}

[env:solarmeshtasticnode_room_repeater]
extends = solarmeshtasticnode
build_flags =
  ${solarmeshtasticnode.build_flags}
  -D MAX_NEIGHBOURS=50
build_src_filter = ${solarmeshtasticnode.build_src_filter}
  +<../examples/repeater_room_hybrid>
lib_deps =
  ${solarmeshtasticnode.lib_deps}
  ${esp32_ota.lib_deps}
